global: { scrape_interval: 5s }
scrape_configs:
  - job_name: ingest
    static_configs: [{ targets: ["ingest:4001"] }]
  - job_name: api
    static_configs: [{ targets: ["api:4000"] }]
  - job_name: processor          # DNS returns every replica
    dns_sd_configs: [{ names: ["processor"], type: A, port: 9102 }]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs: [{ targets: ["redpanda:9644"] }]
