name: ci
on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: cd backend && npm ci
      - run: cd backend && npm run coverage          # fails below 80% lines
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: backend/coverage/lcov.info }
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npm run build
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cd ml && pip install -r requirements.txt && python train.py
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SAST (Semgrep)
        run: pip install semgrep && semgrep --config auto --error --exclude node_modules backend frontend ml
      - name: Dependency audit (npm)
        run: cd backend && npm ci && npm audit --omit=dev --audit-level=high
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with: { scan-type: fs, scan-ref: ., severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }
      - name: Build backend image
        run: docker build -t fleetnorm-backend backend
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with: { image-ref: fleetnorm-backend, severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }
  e2e-dast:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - run: bash infra/ci-e2e.sh
      - name: DAST (OWASP ZAP baseline against the API)
        uses: zaproxy/action-baseline@v0.12.0
        with: { target: "http://localhost:4000", fail_action: false }
